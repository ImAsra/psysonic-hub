# Psysonic Hub. Put this file and your ".env" (see .env.example) in a folder, then:
#   docker compose up -d
services:
  psysonic-hub:
    image: ghcr.io/imasra/psysonic-hub:latest # built and published by this repository's workflow
    # No registry? Build straight from the repository instead (replace the line above):
    # build: https://github.com/imasra/psysonic-hub.git#main
    container_name: psysonic-hub
    restart: unless-stopped
    env_file: .env
    ports:
      - "5533:5533"
      # Behind a reverse proxy on the same machine? Publish on the loopback interface only,
      # so the proxy is the single way in (and set HUB_TRUST_PROXY=1 in .env):
      # - "127.0.0.1:5533:5533"
    volumes:
      - hubdata:/data # keeps the shared settings across restarts
    init: true # proper signal handling and zombie reaping
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

volumes:
  hubdata:
