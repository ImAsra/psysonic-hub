# Psysonic Hub. Put this file and your ".env" (see .env.example) in a folder, then:
services:
  psysonic-hub:
    image: ghcr.io/imasra/psysonic-hub:0.3
    container_name: psysonic-hub
    restart: unless-stopped
    env_file: .env
    ports:
      - "5533:5533"
    volumes:
      - hubdata:/data
    init: true
    stop_grace_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

volumes:
  hubdata:
