version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # let a new release prove itself for a week before proposing it
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # Move to a new Node major version yourself, once it is an LTS release.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
