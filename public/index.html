<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181825">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Psysonic Remote</title>
<style>
  /* Colors follow Psysonic's default theme (Catppuccin Mocha); light mode uses Latte. */
  :root {
    color-scheme: dark light;
    --bg-app: #1e1e2e; --bg-sidebar: #181825; --bg-card: #313244; --bg-hover: #45475a; --bg-deep: #11111b;
    --accent: #cba6f7; --accent-2: #89b4fa; --accent-dim: rgba(203, 166, 247, .15); --accent-glow: rgba(203, 166, 247, .3);
    --text: #cdd6f4; --text-2: #bac2de; --muted: #a6adc8; --border: #45475a; --border-subtle: #313244;
    --on-accent: #11111b; --danger: #f38ba8; --ok: #a6e3a1;
    --radius: 16px; --radius-sm: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-app: #eff1f5; --bg-sidebar: #e6e9ef; --bg-card: #ffffff; --bg-hover: #ccd0da; --bg-deep: #dce0e8;
      --accent: #8839ef; --accent-2: #1e66f5; --accent-dim: rgba(136, 57, 239, .12); --accent-glow: rgba(136, 57, 239, .25);
      --text: #4c4f69; --text-2: #5c5f77; --muted: #6c6f85; --border: #bcc0cc; --border-subtle: #ccd0da;
      --on-accent: #ffffff; --danger: #d20f39; --ok: #40a02b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-sidebar); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 420px at 15% -10%, var(--accent-dim), transparent 60%),
      radial-gradient(700px 380px at 100% 0%, rgba(137, 180, 250, .10), transparent 60%),
      var(--bg-app);
    background-attachment: fixed;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { max-width: 520px; margin: 0 auto; }

  /* header / brand */
  header { display: flex; align-items: center; gap: 12px; padding: 22px 2px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .logo {
    display: none; width: 168px; max-width: 55vw; aspect-ratio: 594.45 / 134.93;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-mask: url(/logo.svg) left center / contain no-repeat; mask: url(/logo.svg) left center / contain no-repeat;
  }
  .logo.ok { display: block; }
  .brand-name { font-weight: 800; font-size: 22px; letter-spacing: .2px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-name.hidden { display: none; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 99px; padding: 4px 10px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .pill.bad .dot { background: var(--danger); }

  /* cards */
  .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); }
  .card h2, summary { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .hidden { display: none !important; }
  .sub { color: var(--muted); font-size: 14px; }

  .link-btn { font: inherit; font-size: 12px; font-weight: 700; color: var(--muted); background: transparent; border: 1px solid var(--border);
    border-radius: 99px; padding: 4px 10px; cursor: pointer; }
  .link-btn:hover { color: var(--text); border-color: var(--accent); }
  .msg { min-height: 1.3em; margin-top: 10px; font-size: 13px; color: var(--danger); }
  .art { position: relative; overflow: hidden; }
  .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* login */
  label.field { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  input[type=password], input[type=text] { width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); font: inherit;
    color: var(--text); background: var(--bg-sidebar); border: 1px solid var(--border); outline: none; }
  input[type=password]:focus, input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .btn { font: inherit; font-weight: 700; border: 0; border-radius: var(--radius-sm); padding: 12px 18px; cursor: pointer;
    background: var(--accent); color: var(--on-accent); transition: transform .08s, filter .15s; }
  .btn:hover { filter: brightness(1.08); } .btn:active { transform: scale(.97); }
  .btn.block { width: 100%; margin-top: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* now playing */
  .np { display: flex; gap: 14px; align-items: center; }
  .art { flex: none; width: 76px; height: 76px; border-radius: 14px; display: grid; place-items: center; color: var(--on-accent);
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 18px var(--accent-glow); }
  .art svg { width: 34px; height: 34px; opacity: .85; }
  .meta { min-width: 0; flex: 1; }
  .title { font-size: 19px; font-weight: 750; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .artist { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .on-dev { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--accent);
    background: var(--accent-dim); border-radius: 99px; padding: 3px 10px; }
  .on-dev.none { color: var(--muted); background: transparent; padding-left: 0; font-weight: 600; }
  .controls-off .np, .controls-off .transport, .controls-off .vol { opacity: .45; pointer-events: none; }

  /* sliders */
  input[type=range] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 6px; margin: 16px 0 6px; padding: 0;
    border-radius: 99px; outline: none; cursor: pointer;
    background: linear-gradient(to right, var(--accent) var(--fill, 0%), var(--bg-hover) var(--fill, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; border: 0;
    background: var(--text); box-shadow: 0 0 0 4px var(--accent-dim), 0 2px 6px rgba(0, 0, 0, .35); }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; border: 0; background: var(--text);
    box-shadow: 0 0 0 4px var(--accent-dim), 0 2px 6px rgba(0, 0, 0, .35); }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .transport { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 14px 0 4px; }
  .icon-btn { display: grid; place-items: center; width: 48px; height: 48px; border: 0; border-radius: 50%; cursor: pointer;
    color: var(--text); background: transparent; transition: background .15s, transform .08s; }
  .icon-btn:hover { background: var(--bg-hover); } .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn.main { width: 64px; height: 64px; color: var(--on-accent); background: var(--accent);
    box-shadow: 0 6px 22px var(--accent-glow); }
  .icon-btn.main:hover { filter: brightness(1.08); background: var(--accent); }
  .icon-btn.main svg { width: 30px; height: 30px; }

  .vol { display: flex; align-items: center; gap: 12px; margin-top: 10px; color: var(--muted); }
  .vol svg { flex: none; width: 20px; height: 20px; }
  .vol input { margin: 8px 0; }

  /* devices */
  .dev { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 10px; margin-top: 6px; border: 0; cursor: pointer;
    border-radius: var(--radius-sm); font: inherit; text-align: left; color: var(--text); background: transparent; transition: background .15s; }
  .dev:hover { background: var(--bg-hover); }
  .dev.active { color: var(--accent); background: var(--accent-dim); font-weight: 700; }
  .dev svg { flex: none; width: 22px; height: 22px; }
  .dev .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev .chip { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  #devices { margin-top: 8px; }

  /* settings sync */
  details.card > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary::after { content: "▾"; font-size: 14px; transition: transform .2s; }
  details.card[open] > summary::after { transform: rotate(180deg); }
  .sync-row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--border-subtle); cursor: pointer; }
  .sync-row:first-of-type { border-top: 0; }
  .sync-row .t { flex: 1; min-width: 0; font-weight: 650; }
  .sync-row .d { color: var(--muted); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .switch { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 46px; height: 26px; margin: 0; border-radius: 99px;
    background: var(--bg-hover); cursor: pointer; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .35); transition: transform .2s; }
  .switch:checked { background: var(--accent); } .switch:checked::after { transform: translateX(20px); }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 0; }
  @media (max-width: 400px) { .tag { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <span id="logo" class="logo" role="img" aria-label="Psysonic"></span>
      <span id="brandName" class="brand-name">Psysonic</span>
      <span class="tag">Remote</span>
    </div>
    <span id="status" class="pill"><span class="dot"></span><span id="statusText">Not connected</span></span>
    <button id="logout" class="link-btn hidden" type="button">Sign out</button>
  </header>

  <section id="login" class="card hidden">
    <form id="loginForm" autocomplete="on">
      <div id="pwForm" class="hidden">
        <label class="field" for="user">Username</label>
        <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        <label class="field" for="pass" style="margin-top:12px">Password</label>
        <input id="pass" type="password" autocomplete="current-password">
      </div>
      <div id="tokenForm" class="hidden">
        <label class="field" for="token">Hub token</label>
        <input id="token" type="password" autocomplete="off" placeholder="HUB_TOKEN">
      </div>
      <div id="loginMsg" class="msg" role="alert"></div>
      <button id="connect" class="btn block" type="submit">Sign in</button>
    </form>
  </section>

  <section id="main" class="card hidden">
    <div class="np">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        <img id="cover" class="cover hidden" alt="">
      </div>
      <div class="meta">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist">&nbsp;</div>
        <div class="on-dev none" id="playingOn"></div>
      </div>
    </div>

    <input type="range" id="seek" min="0" max="1" step="1" value="0" aria-label="Seek">
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>

    <div class="transport">
      <button class="icon-btn" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg>
      </button>
      <button class="icon-btn main" id="toggle" aria-label="Play or pause">
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icoPause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="icon-btn" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>

    <div class="vol">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
    </div>
  </section>

  <section id="devicesCard" class="card hidden">
    <h2>Play on</h2>
    <div id="devices"></div>
    <div class="sub" id="noDevices" style="margin-top:8px"></div>
  </section>

  <details id="syncCard" class="card hidden">
    <summary>Settings sync</summary>
    <div class="sub" style="margin:10px 0 6px">Choose what is kept identical on all your devices. Changes apply to every device.</div>
    <div id="syncList"></div>
  </details>

  <footer>Self-hosted · your music, your devices</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const deviceId = store.get('deviceId') || ('web-' + Math.random().toString(36).slice(2, 12));
store.set('deviceId', deviceId);

// Logo: only shown if /logo.svg exists; otherwise the text brand stays.
const probe = new Image();
probe.onload = () => { $('logo').classList.add('ok'); $('brandName').classList.add('hidden'); };
probe.src = '/logo.svg';

let ws, devices = [], state = null, stateAt = 0, retry = 0, dragging = false, volDragging = false;
let catalog = [], syncCfg = {};

const paint = (el) => {
  const min = Number(el.min) || 0, max = Number(el.max) || 1;
  el.style.setProperty('--fill', (((el.value - min) / (max - min)) * 100 || 0) + '%');
};
const setStatus = (text, cls) => { $('statusText').textContent = text; $('status').className = 'pill' + (cls ? ' ' + cls : ''); };

let mode = 'token';
let coverTrack = '', coverUrl = '', coverTimer = null;

function showLogin(msg) {
  $('main').classList.add('hidden'); $('devicesCard').classList.add('hidden'); $('syncCard').classList.add('hidden');
  $('login').classList.remove('hidden'); $('logout').classList.add('hidden');
  $('loginMsg').textContent = msg || '';
}

async function loadCover(trackId, attempt = 0) {
  clearTimeout(coverTimer);
  if (!trackId) return hideCover();
  try {
    const headers = mode === 'token' ? { authorization: 'Bearer ' + store.get('token') } : {};
    const r = await fetch('/api/cover?track=' + encodeURIComponent(trackId), { headers, credentials: 'same-origin' });
    if (trackId !== coverTrack) return; // changed while loading
    if (r.ok) {
      const url = URL.createObjectURL(await r.blob());
      if (coverUrl) URL.revokeObjectURL(coverUrl);
      coverUrl = url;
      $('cover').src = url; $('cover').classList.remove('hidden');
      return;
    }
  } catch { /* retry below */ }
  // The cover is uploaded a moment after the track starts; try a few times.
  if (attempt < 4) coverTimer = setTimeout(() => loadCover(trackId, attempt + 1), 1200);
}
function hideCover() { $('cover').classList.add('hidden'); $('cover').removeAttribute('src'); }

function connect() {
  const token = mode === 'token' ? ($('token').value || store.get('token')) : null;
  if (mode === 'token' && !token) return showLogin('');
  if (token) store.set('token', token);
  setStatus('Connecting…');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  // Password mode: no token is sent; the login session cookie authenticates the page.
  ws.onopen = () => ws.send(JSON.stringify({ t: 'hello', v: 1, token, deviceId, name: 'Phone remote', kind: 'web' }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'welcome') {
      retry = 0;
      $('login').classList.add('hidden'); $('main').classList.remove('hidden');
      $('logout').classList.toggle('hidden', mode !== 'password');
      setStatus('Connected', 'on');
      catalog = m.syncCatalog || []; syncCfg = m.syncConfig || {}; drawSync();
    }
    if (m.t === 'sync-config') { syncCfg = m.config || {}; drawSync(); }
    if (m.t === 'welcome' || m.t === 'devices') { devices = m.devices.filter((d) => d.kind !== 'web'); drawDevices(); }
    if (m.t === 'state' || (m.t === 'welcome' && m.state)) {
      state = m.state; stateAt = Date.now(); draw();
      if (state.trackId !== coverTrack) { coverTrack = state.trackId || ''; hideCover(); loadCover(coverTrack); }
    }
  };
  ws.onclose = (e) => {
    if (e.code === 4005) {
      setStatus(mode === 'password' ? 'Signed out' : 'Wrong token', 'bad');
      return showLogin(mode === 'password' ? 'Your session ended. Please sign in again.' : 'Wrong token.');
    }
    setStatus('Reconnecting…', 'bad');
    setTimeout(connect, Math.min(1000 * 2 ** retry++, 15000));
  };
}

async function signIn() {
  $('loginMsg').textContent = '';
  if (mode === 'token') return connect();
  $('connect').disabled = true;
  try {
    const r = await fetch('/auth/login', { method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user: $('user').value, password: $('pass').value }) });
    if (r.ok) { $('pass').value = ''; return connect(); }
    if (r.status === 429) {
      const { retryAfter } = await r.json().catch(() => ({}));
      $('loginMsg').textContent = 'Too many attempts. Try again in ' + Math.max(1, Math.ceil((retryAfter || 60) / 60)) + ' min.';
    } else {
      $('loginMsg').textContent = 'Wrong username or password.';
    }
  } catch { $('loginMsg').textContent = 'Could not reach the hub.'; }
  finally { $('connect').disabled = false; }
}

async function signOut() {
  try { await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch {}
  if (ws) { ws.onclose = null; ws.close(); }
  state = null; coverTrack = ''; hideCover();
  setStatus('Not connected');
  showLogin('Signed out.');
}

async function init() {
  try { mode = (await (await fetch('/auth/config')).json()).mode; } catch { /* keep token mode */ }
  $('pwForm').classList.toggle('hidden', mode !== 'password');
  $('tokenForm').classList.toggle('hidden', mode !== 'token');
  if (mode === 'password') {
    const me = await fetch('/auth/me', { credentials: 'same-origin' }).catch(() => null);
    if (me && me.ok) return connect();
    return showLogin('');
  }
  if (store.get('token')) { $('token').value = store.get('token'); return connect(); }
  showLogin('');
}

const ICON = {
  desktop: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v9h16V6H4z"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v14h8V4H8zm4 15.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>',
};
const activeDev = () => devices.find((d) => d.active);

function drawDevices() {
  const list = $('devices');
  list.replaceChildren();
  for (const d of devices) {
    const b = document.createElement('button');
    b.className = 'dev' + (d.active ? ' active' : '');
    b.innerHTML = (ICON[d.kind] || ICON.desktop) + '<span class="name"></span><span class="chip"></span>';
    b.querySelector('.name').textContent = d.name;
    b.querySelector('.chip').textContent = d.active ? 'Playing' : '';
    b.onclick = () => { if (!d.active && ws?.readyState === 1) ws.send(JSON.stringify({ t: 'transfer', to: d.id })); };
    list.appendChild(b);
  }
  $('devicesCard').classList.remove('hidden');
  $('noDevices').textContent = devices.length ? '' : 'No players connected. Open Psysonic on a device with the hub enabled.';
  const a = activeDev();
  const on = $('playingOn');
  on.textContent = a ? '▶ Playing on ' + a.name : (devices.length ? 'No active device. Pick one below.' : '');
  on.className = 'on-dev' + (a ? '' : ' none');
  $('main').classList.toggle('controls-off', !a);
}

function drawSync() {
  const list = $('syncList');
  list.replaceChildren();
  for (const c of catalog) {
    const row = document.createElement('label');
    row.className = 'sync-row';
    row.innerHTML = '<span class="t"><span class="n"></span><div class="d"></div></span><input type="checkbox" class="switch">';
    row.querySelector('.n').textContent = c.label;
    row.querySelector('.d').textContent = c.desc;
    const box = row.querySelector('input');
    box.checked = syncCfg[c.id] === true;
    box.onchange = () => { if (ws?.readyState === 1) ws.send(JSON.stringify({ t: 'sync-config', category: c.id, enabled: box.checked })); };
    list.appendChild(row);
  }
  $('syncCard').classList.toggle('hidden', catalog.length === 0);
}

const cmd = (action, args) => { const to = activeDev()?.id; if (to && ws?.readyState === 1) ws.send(JSON.stringify({ t: 'command', to, action, args })); };
const nowPos = () => state ? (state.positionSec || 0) + (state.playing ? (Date.now() - stateAt) / 1000 : 0) : 0;

function draw() {
  if (!state) return;
  $('title').textContent = state.title || 'Nothing playing';
  $('artist').textContent = [state.artist, state.album].filter(Boolean).join(' · ') || '\u00a0';
  $('icoPlay').classList.toggle('hidden', !!state.playing);
  $('icoPause').classList.toggle('hidden', !state.playing);
  $('seek').max = state.durationSec || 1;
  $('dur').textContent = fmt(state.durationSec);
  if (!volDragging && typeof state.volume === 'number') { $('vol').value = state.volume; paint($('vol')); }
}
setInterval(() => {
  if (state && !dragging) { const p = Math.min(nowPos(), state.durationSec || nowPos()); $('seek').value = p; $('pos').textContent = fmt(p); paint($('seek')); }
}, 250);

$('loginForm').addEventListener('submit', (e) => { e.preventDefault(); signIn(); });
$('logout').onclick = signOut;
$('toggle').onclick = () => cmd('toggle');
$('prev').onclick = () => cmd('prev');
$('next').onclick = () => cmd('next');
$('seek').oninput = () => { dragging = true; $('pos').textContent = fmt($('seek').value); paint($('seek')); };
$('seek').onchange = () => {
  cmd('seek', { positionSec: Number($('seek').value) });
  if (state) { state.positionSec = Number($('seek').value); stateAt = Date.now(); }
  dragging = false;
};
$('vol').oninput = () => { volDragging = true; paint($('vol')); cmd('volume', { volume: Number($('vol').value) }); };
$('vol').onchange = () => { volDragging = false; };
paint($('seek')); paint($('vol'));
init();
</script>
</body>
</html>
