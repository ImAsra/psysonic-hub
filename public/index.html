
 
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181825">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Psysonic">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Psysonic Hub</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <header>
    <div class="brand">
      <span id="logo" class="logo" role="img" aria-label="Psysonic"></span>
      <span id="brandName" class="brand-name">Psysonic</span>
      <span class="tag" data-i18n="app.remote">Hub</span>
    </div>
 
    <label class="language-picker">
      <span class="sr-only" data-i18n="language.label">Language</span>
      <select id="language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="nl">Nederlands</option>
        <option value="bg">Български</option>
        <option value="el">Ελληνικά</option>
        <option value="fr">Français</option>
        <option value="hu">Magyar</option>
        <option value="it">Italiano</option>
        <option value="ja">日本語</option>
        <option value="nb">Norsk bokmål</option>
        <option value="pl">Polski</option>
        <option value="ro">Română</option>
        <option value="ru">Русский</option>
        <option value="uk">Українська</option>
        <option value="zh">简体中文</option>
      </select>
    </label>
 
    <span id="status" class="pill">
      <span class="dot"></span>
      <span id="statusText" data-i18n="status.notConnected">Not connected</span>
    </span>
 
    <button id="logout" class="link-btn hidden" type="button" data-i18n="login.signOut">Sign out</button>
  </header>
 
  <section id="login" class="card hidden">
    <form id="loginForm" autocomplete="on">
      <div id="pwForm" class="hidden">
        <label class="field" for="user" data-i18n="login.username">Username</label>
        <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
 
        <label class="field gap-top" for="pass" data-i18n="login.password">Password</label>
        <input id="pass" type="password" autocomplete="current-password">
      </div>
 
      <div id="tokenForm" class="hidden">
        <label class="field" for="token" data-i18n="login.hubToken">Hub token</label>
        <input id="token" type="password" autocomplete="off" placeholder="HUB_TOKEN">
      </div>
 
      <div id="loginMsg" class="msg" role="alert"></div>
      <button id="connect" class="btn block" type="submit" data-i18n="login.signIn">Sign in</button>
    </form>
  </section>
 
  <section id="main" class="card hidden">
    <div class="np">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
        </svg>
        <img id="cover" class="cover hidden" alt="">
      </div>
 
      <div class="meta">
        <div class="title" id="title" data-i18n="player.nothingPlaying">Nothing playing</div>
        <div class="artist" id="artist">&nbsp;</div>
        <div class="on-dev none" id="playingOn"></div>
      </div>
    </div>
 
    <input type="range" id="seek" min="0" max="1" step="1" value="0"
      aria-label="Seek" data-i18n-aria-label="player.seek">
 
    <div class="times">
      <span id="pos">0:00</span>
      <span id="dur">0:00</span>
    </div>
 
    <div class="transport">
      <button class="icon-btn" id="prev" aria-label="Previous" data-i18n-aria-label="player.previous">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zM9.5 12 18 18V6z"/>
        </svg>
      </button>
 
      <button class="icon-btn main" id="toggle" aria-label="Play or pause" data-i18n-aria-label="player.toggle">
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icoPause" class="hidden" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
        </svg>
      </button>
 
      <button class="icon-btn" id="next" aria-label="Next" data-i18n-aria-label="player.next">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>
        </svg>
      </button>
    </div>
 
    <div class="vol">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>
      </svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5"
        aria-label="Volume" data-i18n-aria-label="player.volume">
    </div>
  </section>
 
  <section id="queueCard" class="card hidden">
    <h2 data-i18n="queue.title">Up next</h2>
    <div id="queueList" class="rows"></div>
    <div id="queueMore" class="sub gap-top-sm"></div>
  </section>

  <section id="libraryCard" class="card hidden">
    <h2 data-i18n="library.title">Library</h2>
    <form id="searchForm" class="search" role="search">
      <input id="search" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
        placeholder="Search" data-i18n-placeholder="library.search">
    </form>
    <div id="libTabs" class="chips">
      <button type="button" class="chip-btn" data-tab="albums" data-i18n="library.albums">Albums</button>
      <button type="button" class="chip-btn" data-tab="artists" data-i18n="library.artists">Artists</button>
      <button type="button" class="chip-btn" data-tab="playlists" data-i18n="library.playlists">Playlists</button>
    </div>
    <div id="albumSorts" class="chips small">
      <button type="button" class="chip-btn" data-sort="newest" data-i18n="library.sort.newest">Newest</button>
      <button type="button" class="chip-btn" data-sort="recent" data-i18n="library.sort.recent">Recently played</button>
      <button type="button" class="chip-btn" data-sort="frequent" data-i18n="library.sort.frequent">Most played</button>
      <button type="button" class="chip-btn" data-sort="random" data-i18n="library.sort.random">Random</button>
      <button type="button" class="chip-btn" data-sort="alphabeticalByName" data-i18n="library.sort.name">A–Z</button>
      <button type="button" class="chip-btn" data-sort="starred" data-i18n="library.sort.starred">Favourites</button>
    </div>
    <div id="libHead" class="lib-head hidden">
      <button id="libBack" type="button" class="link-btn" data-i18n="library.back">‹ Back</button>
      <div class="lib-hero">
        <img id="libArt" class="lib-art hidden" alt="">
        <div class="meta">
          <div id="libTitle" class="title"></div>
          <div id="libSub" class="artist"></div>
        </div>
      </div>
      <div id="libActions" class="lib-actions">
        <button type="button" class="btn" data-mode="play" data-i18n="library.play">Play</button>
        <button type="button" class="btn ghost" data-mode="next" data-i18n="library.playNext">Play next</button>
        <button type="button" class="btn ghost" data-mode="add" data-i18n="library.addToQueue">Add to queue</button>
      </div>
    </div>
    <div id="libBody"></div>
    <div id="libMsg" class="sub gap-top-sm"></div>
    <button id="libMore" type="button" class="btn ghost block hidden" data-i18n="library.more">Load more</button>
  </section>

  <section id="devicesCard" class="card hidden">
    <h2 data-i18n="devices.playOn">Play on</h2>
    <div id="devices"></div>
    <div class="sub gap-top-sm" id="noDevices"></div>
  </section>
 
  <details id="syncCard" class="card hidden" open>
    <summary data-i18n="settings.sync">Settings sync</summary>
    <div class="sub sync-intro" data-i18n="settings.syncIntro">
      Choose what is kept identical on all your devices. Changes apply to every device.
    </div>
    <div id="syncList"></div>
  </details>
 
  <footer data-i18n="footer">Self-hosted · your music, your devices</footer>
</main>
 
<script src="/app.js"></script>
<script src="/library.js"></script>
</body>
</html>
