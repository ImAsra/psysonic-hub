<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181825">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Psysonic Remote</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <header>
    <div class="brand">
      <span id="logo" class="logo" role="img" aria-label="Psysonic"></span>
      <span id="brandName" class="brand-name">Psysonic</span>
      <span class="tag">Remote</span>
    </div>
    <span id="status" class="pill"><span class="dot"></span><span id="statusText">Not connected</span></span>
    <button id="logout" class="link-btn hidden" type="button">Sign out</button>
  </header>

  <section id="login" class="card hidden">
    <form id="loginForm" autocomplete="on">
      <div id="pwForm" class="hidden">
        <label class="field" for="user">Username</label>
        <input id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        <label class="field gap-top" for="pass">Password</label>
        <input id="pass" type="password" autocomplete="current-password">
      </div>
      <div id="tokenForm" class="hidden">
        <label class="field" for="token">Hub token</label>
        <input id="token" type="password" autocomplete="off" placeholder="HUB_TOKEN">
      </div>
      <div id="loginMsg" class="msg" role="alert"></div>
      <button id="connect" class="btn block" type="submit">Sign in</button>
    </form>
  </section>

  <section id="main" class="card hidden">
    <div class="np">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        <img id="cover" class="cover hidden" alt="">
      </div>
      <div class="meta">
        <div class="title" id="title">Nothing playing</div>
        <div class="artist" id="artist">&nbsp;</div>
        <div class="on-dev none" id="playingOn"></div>
      </div>
    </div>

    <input type="range" id="seek" min="0" max="1" step="1" value="0" aria-label="Seek">
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>

    <div class="transport">
      <button class="icon-btn" id="prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg>
      </button>
      <button class="icon-btn main" id="toggle" aria-label="Play or pause">
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icoPause" class="hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="icon-btn" id="next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </div>

    <div class="vol">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
    </div>
  </section>

  <section id="devicesCard" class="card hidden">
    <h2>Play on</h2>
    <div id="devices"></div>
    <div class="sub gap-top-sm" id="noDevices"></div>
  </section>

  <details id="syncCard" class="card hidden">
    <summary>Settings sync</summary>
    <div class="sub sync-intro">Choose what is kept identical on all your devices. Changes apply to every device.</div>
    <div id="syncList"></div>
  </details>

  <footer>Self-hosted · your music, your devices</footer>
</main>

<script src="/app.js"></script>
</body>
</html>
